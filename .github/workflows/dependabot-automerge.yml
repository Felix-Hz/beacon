name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: dependabot-automerge
    # Not github.actor: a "@dependabot rebase" comment makes the commenter the actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Merges made with GITHUB_TOKEN don't fire push workflows, so this waits for ci-ok, merges,
      # then dispatches the deploy, the one event GITHUB_TOKEN may trigger.
      - name: Wait for ci-ok, merge, deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A transient API error reads as "not finished yet", so the loop polls again
          state=""
          for _ in $(seq 1 80); do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-ok&filter=latest" \
              -q '.check_runs[0] | if . then .status + ":" + (.conclusion // "") else "" end' || true)
            case "$state" in
              completed:success) break ;;
              completed:*) echo "ci-ok finished as ${state#completed:}; leaving the PR open for a human."; exit 0 ;;
            esac
            sleep 30
          done
          [ "$state" = "completed:success" ] || { echo "::error::ci-ok didn't finish within 40 minutes"; exit 1; }
          gh pr merge "$PR" --squash --match-head-commit "$SHA" -R "$REPO"
          gh workflow run deploy.yml --ref main -R "$REPO"
